<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Space Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          class="brand-logo"
          src="./New%20folder/image.png"
          alt="NASA Space Explorer logo"
        />
        <h1>NASA Space Explorer</h1>
      </div>
      <p>Explore the cosmos through NASA's Astronomy Picture of the Day archive.</p>
    </header>

    <main class="search-section">
      <div class="date-controls">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" />
      </div>

      <div class="date-controls">
        <label for="endDate">End Date</label>
        <input type="date" id="endDate" />
      </div>

      <button id="getImages" type="button">View Space Images</button>
      <p id="status" class="status"></p>
    </main>

    <section id="gallery" class="gallery" aria-live="polite"></section>

    <script src="script.js"></script>
  </body>
</html>
